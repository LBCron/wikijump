name: '[backend] Docker build PostgreSQL (local)'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'install/common/postgres/**'
      - 'install/dev/postgres/Dockerfile'
      - 'install/local/postgres/Dockerfile'
      - 'scripts/upgrade-postgres-volume.sh'
      - 'scripts/test-postgres-volume-upgrade.sh'
      - '.github/workflows/docker-build-postgres.local.yaml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build image
        run: docker build -f install/local/postgres/Dockerfile .
        env:
          DOCKER_BUILDKIT: 1

      - name: Upgrade a volume from the previous major version
        run: bash scripts/test-postgres-volume-upgrade.sh
