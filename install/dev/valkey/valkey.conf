# Listen on the container network only; docker-compose does not publish this port.
bind 0.0.0.0 -::
protected-mode yes
port 6379

tcp-backlog 511
tcp-keepalive 300

daemonize no

# emit to stdout
loglevel notice
logfile ""

# daily backups
# or hourly if >1 million changes
save 86400 1 3600 1000000

# causes error if backups aren't working
stop-writes-on-bgsave-error yes

rdbcompression yes
rdbchecksum yes

appendonly yes
appendfsync everysec

# See install/local/valkey/valkey.conf for the reasoning: noeviction keeps
# permission fences and the job queue intact, and the ceiling only bounds the
# anonymous article-view cache, whose entries expire after one hour.
maxmemory 1gb
maxmemory-policy noeviction
