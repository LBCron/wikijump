[logger]
enable = true
level = "info"

[server]
address = "[::]:2747"
pid-file = "/run/deepwell.pid"

[database]
run-seeder = true
seeder-path = "seeder"
# Local-lab performance setting.
sqlx-logging = false
# The workstation runs many stacks at once; keep each pool small. The local
# database keeps PostgreSQL's default max_connections, so this is headroom.
max-connections = 16
statement-cache-capacity = 32
max-lifetime-secs = 1800

[security]
authentication-fail-delay-ms = 100

[security.session]
token-prefix = "wj:"
token-length = 64
duration-session-minutes = 30
duration-login-minutes = 5

[security.mfa]
recovery-code-count = 4
recovery-code-length = 8
mfa-digits = 6
time-step = 30
time-skew = 1

# The local development stack is its own environment: every host it serves
# is standing's host with `.localhost` replaced by `.dev.localhost`, so a URL,
# cookie, or redirect always names the stack it belongs to. Standing keeps
# `wikijump.localhost` on 443. The port is configured only here, never in a
# domain; keep these values in sync with docker-compose.yaml.
[domain]
main = "wikijump.dev.localhost"
https-port = 18443
files = "wjfiles.dev.localhost"

[job]
workers = 2
max-attempts = 3
delay-ms = 5
min-delay-poll-secs = 10  # 10 seconds
max-delay-poll-secs = 360  # 6 minutes
prune-session-secs = 600  # 10 minutes
prune-upload-secs = 600  # 10 minutes
prune-text-secs = 86400  # 1 day
name-change-refill-secs = 86400  # 1 day
lift-expired-punishments-secs = 86400  # 1 day

[locale]
path = "/opt/locales"

[ftml]
render-timeout-ms = 300000
preprocess-timeout-ms = 30000
# The workstation runs many stacks at once; bound concurrent renders so a
# burst in one stack cannot hold a large multiple of a render's footprint
# resident (PLAN-memory-reduction phase 4, intervention 6).
render-concurrency = 8
render-queue-timeout-ms = 60000
rerender-skip = [
    { job-depth = 3, last-update-ms = 100 },
    { job-depth = 10, last-update-ms = 1500 },
    { job-depth = 50, last-update-ms = 0 },
]
[ftml.layout]
messages = "wikijump"
default-page = "wikidot"

[blueprint]
page-prefix = "_"
template = "_template"
missing = "_404"
private = "_public"
banned = "_ban"

[user]
default-name-changes = 2
maximum-name-changes = 3
minimum-name-bytes = 4
minimum-name-chars = 2
refill-name-change-days = 90

[email]
mock-mailcheck = true
automation-address = "noreply@wikijump.dev.localhost"
notification-address = "notifications@wikijump.dev.localhost"
newsletter-address = "newsletter@wikijump.dev.localhost"

[file]
presigned-path-length = 32
presigned-expiration-minutes = 10
maximum-blob-size-kb = 1048576  # 1 GiB
maximum-avatar-size-kb = 4096  # 4 MiB

[message]
maximum-subject-bytes = 128
maximum-body-bytes = 200000
maximum-recipients = 6
