bind 0.0.0.0 -::
protected-mode no
port 6379

tcp-backlog 511
tcp-keepalive 300

daemonize no

# emit to stdout
loglevel notice
logfile ""

# daily backups
# or hourly if >1 million changes
save 86400 1 3600 1000000

# causes error if backups aren't working
stop-writes-on-bgsave-error yes

rdbcompression yes
rdbchecksum yes

appendonly yes
appendfsync everysec

# Memory guardrail (PLAN-memory-reduction phase 1, intervention 2).
#
# Before the article-view TTL, the anonymous article cache had no expiry at
# all: every site write, permission change, re-render, and renderer promotion
# left an unreachable entry resident forever. The 2026-11-05 baseline on the
# standing stack measured 736,699,848 bytes used_memory with 8,077
# `deepwell:article-view:page:*` keys (average 86,650 bytes, maximum 393,600),
# and the family accounted for about 700 MB of it. With the one-hour TTL in
# Deepwell this is a ceiling above the measured working set, not a target.
#
# The policy is `noeviction` on purpose. `volatile-*` could evict the
# permission-cache fence keys early; those keys are version counters, so
# losing one resets the counter and can make an older entry reachable again
# (see PLAN-memory-reduction Q1). Deepwell treats a failed cache write as a
# cache miss (Q2), so reaching the ceiling degrades cache hit rate rather than
# failing a page view.
maxmemory 1gb
maxmemory-policy noeviction
